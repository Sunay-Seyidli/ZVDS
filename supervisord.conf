[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10

[program:xfce]
command=startxfce4
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -wait 50 -noxdamage -repeat
autorestart=true
priority=30

[program:websockify]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=40

[program:webos-server]
command=node server.js
directory=/app
environment=PORT="%(ENV_PORT)s",DISPLAY=":99",HOME="/root"
autorestart=true
priority=50

