<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Chrome - Yeni Sekme</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 80%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 select-none">
  <div class="w-full max-w-2xl flex flex-col items-center text-center space-y-8 animate-fade-in">
    <!-- Google / Chrome Logo Header -->
    <div class="flex items-center space-x-4 mb-2">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 via-emerald-500 to-amber-400 p-0.5 shadow-xl shadow-blue-500/20 flex items-center justify-center">
        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
          <i class="fa-brands fa-chrome text-3xl text-transparent bg-clip-text bg-gradient-to-tr from-blue-400 via-emerald-400 to-amber-300"></i>
        </div>
      </div>
      <div class="text-left">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center space-x-2">
          <span>Google Chrome</span>
          <span class="text-[10px] uppercase font-mono px-2 py-0.5 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full font-semibold">WebOS Cloud</span>
        </h1>
        <p class="text-xs text-slate-400">Hızlı, Güvenli ve Entegre Web Gezgini</p>
      </div>
    </div>

    <!-- Search Box -->
    <form id="search-form" class="w-full relative shadow-2xl">
      <div class="relative flex items-center bg-slate-900/90 border border-slate-700/80 hover:border-slate-600 focus-within:border-blue-500 rounded-2xl px-5 py-4 transition-all duration-200 backdrop-blur-md">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-base mr-3.5"></i>
        <input
          id="search-input"
          type="text"
          placeholder="Google'da arayın veya bir web adresi (URL) yazın..."
          autocomplete="off"
          autofocus
          class="w-full bg-transparent text-slate-100 text-sm focus:outline-none placeholder-slate-500 font-normal"
        />
        <button
          type="submit"
          class="ml-3 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md shadow-blue-600/30 flex items-center space-x-1.5 active:scale-95"
        >
          <span>Ara</span>
          <i class="fa-solid fa-arrow-right text-[11px]"></i>
        </button>
      </div>
    </form>

    <!-- Quick Shortcuts Grid -->
    <div class="w-full">
      <p class="text-xs font-medium text-slate-400 mb-3 text-left">Hızlı Kısayollar</p>
      <div class="grid grid-cols-4 gap-3">
        <!-- Google -->
        <a href="javascript:void(0)" onclick="goTo('https://www.google.com')" class="group flex flex-col items-center justify-center p-3.5 bg-slate-900/60 hover:bg-slate-800/90 border border-slate-800 hover:border-blue-500/40 rounded-xl transition-all hover:scale-105">
          <div class="w-10 h-10 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg mb-2 group-hover:bg-blue-500 group-hover:text-white transition-colors">
            <i class="fa-brands fa-google"></i>
          </div>
          <span class="text-xs text-slate-300 font-medium">Google</span>
        </a>

        <!-- YouTube -->
        <a href="javascript:void(0)" onclick="goTo('https://www.youtube.com')" class="group flex flex-col items-center justify-center p-3.5 bg-slate-900/60 hover:bg-slate-800/90 border border-slate-800 hover:border-red-500/40 rounded-xl transition-all hover:scale-105">
          <div class="w-10 h-10 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center text-lg mb-2 group-hover:bg-red-500 group-hover:text-white transition-colors">
            <i class="fa-brands fa-youtube"></i>
          </div>
          <span class="text-xs text-slate-300 font-medium">YouTube</span>
        </a>

        <!-- Wikipedia -->
        <a href="javascript:void(0)" onclick="goTo('https://tr.wikipedia.org')" class="group flex flex-col items-center justify-center p-3.5 bg-slate-900/60 hover:bg-slate-800/90 border border-slate-800 hover:border-emerald-500/40 rounded-xl transition-all hover:scale-105">
          <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg mb-2 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <span class="text-xs text-slate-300 font-medium">Vikipedi</span>
        </a>

        <!-- GitHub -->
        <a href="javascript:void(0)" onclick="goTo('https://github.com')" class="group flex flex-col items-center justify-center p-3.5 bg-slate-900/60 hover:bg-slate-800/90 border border-slate-800 hover:border-purple-500/40 rounded-xl transition-all hover:scale-105">
          <div class="w-10 h-10 rounded-full bg-purple-500/10 text-purple-400 flex items-center justify-center text-lg mb-2 group-hover:bg-purple-500 group-hover:text-white transition-colors">
            <i class="fa-brands fa-github"></i>
          </div>
          <span class="text-xs text-slate-300 font-medium">GitHub</span>
        </a>
      </div>
    </div>

    <!-- Info Footer -->
    <div class="flex items-center justify-between w-full pt-4 border-t border-slate-800 text-[11px] text-slate-500">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Cloud Web Proxy & VDS Motoru Aktif</span>
      </div>
      <div>
        <span>WebOS VDS Sürüm 2.0</span>
      </div>
    </div>
  </div>

  <script>
    function goTo(targetUrl) {
      if (!targetUrl || targetUrl.trim() === '') return;
      targetUrl = targetUrl.trim();
      
      let finalUrl = targetUrl;
      if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
          finalUrl = 'https://' + targetUrl;
        } else {
          finalUrl = 'https://www.google.com/search?q=' + encodeURIComponent(targetUrl);
        }
      }
      
      try {
        window.parent.postMessage({ type: 'browser-url', url: finalUrl }, '*');
      } catch(e) {}
      
      window.location.href = '/api/proxy?url=' + encodeURIComponent(finalUrl);
    }

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('search-input').value;
      if (val && val.trim()) {
        goTo(val.trim());
      }
    });
  </script>
</body>
</html>
