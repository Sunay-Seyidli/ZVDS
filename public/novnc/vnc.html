<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebOS VDS Live Desktop (noVNC HTML5)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #vnc-canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col justify-between text-slate-100 relative">

  <!-- Top Toolbar -->
  <header class="h-10 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 text-xs font-semibold text-slate-200">
        <i class="fa-solid fa-desktop text-teal-400"></i>
        <span>VDS X11 Grafik Ekranı</span>
      </div>
      <span id="vnc-badge" class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-amber-950 text-amber-400 border border-amber-800">
        Bağlanıyor...
      </span>
    </div>

    <div class="flex items-center space-x-2 text-xs">
      <button id="btn-reconnect" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition flex items-center space-x-1" title="Yeniden Bağlan">
        <i class="fa-solid fa-rotate-right text-[11px]"></i>
        <span>Yenile</span>
      </button>
      <button id="btn-start-vnc-server" class="px-2.5 py-1 bg-teal-600 hover:bg-teal-500 text-white rounded font-medium transition flex items-center space-x-1 shadow-sm" title="Arka planda X11/VNC sunucusunu başlat">
        <i class="fa-solid fa-play text-[11px]"></i>
        <span>VNC Başlat</span>
      </button>
      <button id="btn-switch-web" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-medium transition flex items-center space-x-1 shadow-sm" title="Google Chrome Web Tarayıcı Moduna Geç">
        <i class="fa-brands fa-chrome text-[11px]"></i>
        <span>Web Tarayıcı Modu</span>
      </button>
    </div>
  </header>

  <!-- Main Display Screen Area -->
  <main id="screen-container" class="flex-1 relative flex items-center justify-center overflow-hidden bg-slate-950">
    
    <!-- Active RFB Canvas Element (when VNC is live) -->
    <div id="noVNC_container" class="w-full h-full flex items-center justify-center"></div>

    <!-- Status & Fallback Overlay Modal -->
    <div id="vnc-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 transition-all">
      <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-4">
        
        <div class="w-14 h-14 bg-teal-500/10 border border-teal-500/30 rounded-2xl flex items-center justify-center mx-auto text-teal-400 text-2xl">
          <i id="overlay-icon" class="fa-solid fa-server fa-pulse"></i>
        </div>

        <div>
          <h3 id="overlay-title" class="text-base font-bold text-slate-100">VDS Grafik Ekran Sunucusu Aranıyor</h3>
          <p id="overlay-desc" class="text-xs text-slate-400 mt-1.5 leading-relaxed">
            Linux X11/Xvfb masaüstü sunucusu kontrol ediliyor. Eğer sunucu henüz aktif değilse aşağıdaki butondan tek tıkla başlatabilir veya doğrudan Web Tarayıcısı modunu kullanabilirsiniz.
          </p>
        </div>

        <div class="pt-2 flex flex-col sm:flex-row gap-2">
          <button id="modal-btn-start" class="flex-1 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5 shadow">
            <i class="fa-solid fa-bolt text-xs"></i>
            <span>VDS Sunucusunu Başlat</span>
          </button>
          <button id="modal-btn-web" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5">
            <i class="fa-brands fa-chrome text-blue-400"></i>
            <span>Web Moduna Geç</span>
          </button>
        </div>

        <div id="launch-log" class="text-[11px] font-mono bg-slate-950 border border-slate-800/80 rounded-lg p-2.5 text-left text-slate-400 hidden max-h-24 overflow-y-auto"></div>
      </div>
    </div>
  </main>

  <script type="module">
    const badge = document.getElementById('vnc-badge');
    const overlay = document.getElementById('vnc-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const overlayIcon = document.getElementById('overlay-icon');
    const launchLog = document.getElementById('launch-log');

    let rfb = null;
    let isConnecting = false;

    // Check VNC server status via API
    async function checkVncStatus() {
      try {
        const res = await fetch('/api/vnc-status');
        const data = await res.json();
        return data.active;
      } catch (e) {
        return false;
      }
    }

    async function tryConnect() {
      if (isConnecting) return;
      isConnecting = true;

      badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-mono bg-amber-950 text-amber-400 border border-amber-800';
      badge.textContent = 'Kontrol ediliyor...';

      const isLive = await checkVncStatus();

      if (isLive) {
        badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-300 border border-emerald-800';
        badge.textContent = 'VDS Canlı';
        overlay.classList.add('hidden');

        // Dynamically import RFB from local vendor package if available
        try {
          const { default: RFB } = await import('/vendor/novnc/core/rfb.js');
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${protocol}//${window.location.host}/websockify`;
          
          const container = document.getElementById('noVNC_container');
          container.innerHTML = '';

          rfb = new RFB(container, wsUrl, {
            credentials: { password: '' },
            wsProtocols: ['binary']
          });

          rfb.scaleViewport = true;
          rfb.resizeSession = true;

          rfb.addEventListener('connect', () => {
            badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-300 border border-emerald-800';
            badge.textContent = 'Bağlandı';
            overlay.classList.add('hidden');
          });

          rfb.addEventListener('disconnect', (e) => {
            badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-mono bg-rose-950 text-rose-300 border border-rose-800';
            badge.textContent = 'Bağlantı Kesildi';
            showOfflineModal();
          });
        } catch (rfbErr) {
          console.warn('RFB client init error:', rfbErr);
          showOfflineModal();
        }
      } else {
        showOfflineModal();
      }

      isConnecting = false;
    }

    function showOfflineModal() {
      badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700';
      badge.textContent = 'Ekran Beklemede';
      overlay.classList.remove('hidden');
      overlayIcon.className = 'fa-solid fa-display text-teal-400';
      overlayTitle.textContent = 'VDS Ekran Sunucusu Başlatılmaya Hazır';
      overlayDesc.textContent = 'X11 grafik oturumu henüz aktif değil. Aşağıdaki butona tıklayarak sunucuyu başlatabilir veya Google Chrome Web Modunu kullanabilirsiniz.';
    }

    // Launch VNC Display on container
    async function startVncServices() {
      launchLog.classList.remove('hidden');
      launchLog.textContent = 'X11 / Xvfb / x11vnc başlatma komutları gönderiliyor...\n';

      try {
        const res = await fetch('/api/vds/start-display', { method: 'POST' });
        const data = await res.json();
        launchLog.textContent += `${data.message || 'Komut tamamlandı.'}\n`;
        
        // Wait 1.5s and retry connect
        setTimeout(() => {
          tryConnect();
        }, 1500);
      } catch (err) {
        launchLog.textContent += `Hata: ${err.message}\n`;
      }
    }

    // Switch to Web Proxy Mode inside parent window
    function switchToWebMode() {
      if (window.parent && window.parent.document) {
        const switchBtn = window.parent.document.getElementById('chrome-btn-switch-vds');
        if (switchBtn) {
          switchBtn.click();
          return;
        }
      }
      window.location.href = '/browser-start.html';
    }

    document.getElementById('btn-reconnect').addEventListener('click', tryConnect);
    document.getElementById('btn-start-vnc-server').addEventListener('click', startVncServices);
    document.getElementById('modal-btn-start').addEventListener('click', startVncServices);
    document.getElementById('btn-switch-web').addEventListener('click', switchToWebMode);
    document.getElementById('modal-btn-web').addEventListener('click', switchToWebMode);

    // Initial check
    tryConnect();
  </script>
</body>
</html>
